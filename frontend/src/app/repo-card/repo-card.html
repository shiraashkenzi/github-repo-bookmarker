<div class="card h-100 shadow-sm">
  <div class="card-body d-flex align-items-center gap-2">
    <img [src]="repo().owner.avatar_url" alt="" width="32" height="32" class="rounded-circle" />
    <span class="fw-semibold text-break flex-grow-1">{{ repo().full_name }}</span>
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-warning]="bookmarked()"
      [class.btn-outline-warning]="!bookmarked()"
      (click)="toggle.emit(repo())"
    >
      {{ bookmarked() ? 'Bookmarked' : 'Bookmark' }}
    </button>
  </div>
</div>
