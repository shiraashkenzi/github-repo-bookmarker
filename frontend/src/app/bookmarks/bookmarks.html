<h1 class="h4 mb-4">Bookmarked repositories</h1>

@if (repos.error(); as error) {
  <div class="alert alert-danger">{{ error }}</div>
}

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
  @for (repo of repos.bookmarks(); track repo.id) {
    <div class="col">
      <app-repo-card [repo]="repo" [bookmarked]="true" (toggle)="repos.toggleBookmark($event)" />
    </div>
  } @empty {
    <p class="text-muted">You have no bookmarks yet.</p>
  }
</div>
